<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการเช่ารถ</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f4; }
        .container { max-width: 700px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .input-box { margin-bottom: 20px; display: flex; gap: 5px; flex-wrap: wrap; }
        input, button { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #007bff; color: white; border: none; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #007bff; color: white; }
    </style>
</head>
<body>

<div class="container">
    <h2>🚗 ตารางเช่ารถ</h2>
    <div class="input-box">
        <input type="text" id="car" placeholder="รุ่นรถ">
        <input type="text" id="name" placeholder="ชื่อผู้เช่า">
        <input type="date" id="date">
        <button id="saveBtn">บันทึก</button>
    </div>
    <table id="myTable">
        <thead>
            <tr><th>รุ่นรถ</th><th>ชื่อผู้เช่า</th><th>วันที่</th></tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script>
    // 1. ใส่ค่าของคุณตรงนี้
    const S_URL = 'https://jgwcyesxajinnpwbtkep.supabase.co'; 
    const S_KEY = 'sb_publishable_SQrXsMRE5mXvcWOFhTZzMw_uTQjMish';
    
    // เปลี่ยนชื่อตัวแปรเป็น mySupabase เพื่อไม่ให้ซ้ำกับคำสั่งระบบ
    const mySupabase = supabase.createClient(S_URL, S_KEY);

    // ฟังก์ชันโหลดข้อมูล
    async function loadData() {
        const { data, error } = await mySupabase.from('car_rentals').select('*');
        if (error) return console.error(error);
        
        const tbody = document.querySelector('#myTable tbody');
        tbody.innerHTML = '';
        data.forEach(row => {
            tbody.innerHTML += `<tr><td>${row.car_model}</td><td>${row.renter_name}</td><td>${row.rental_date}</td></tr>`;
        });
    }

    // ฟังก์ชันบันทึกข้อมูล
    async function saveData() {
        const car = document.getElementById('car').value;
        const name = document.getElementById('name').value;
        const date = document.getElementById('date').value;

        if(!car || !name || !date) return alert('กรอกข้อมูลไม่ครบ');

        const { error } = await mySupabase.from('car_rentals').insert([
            { car_model: car, renter_name: name, rental_date: date }
        ]);

        if (error) {
            alert('บันทึกไม่ได้: ' + error.message);
        } else {
            document.getElementById('car').value = '';
            document.getElementById('name').value = '';
            loadData();
        }
    }

    // สั่งให้ทำงานเมื่อหน้าจอโหลดเสร็จ
    document.getElementById('saveBtn').addEventListener('click', saveData);
    loadData();
</script>

</body>
</html>
