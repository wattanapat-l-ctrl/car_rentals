<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการเช่ารถ - Car Rental</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Chakra Petch', sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h2 { color: #1a73e8; text-align: center; margin-bottom: 30px; }
        .form-group { display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; background: #f8f9fa; padding: 20px; border-radius: 10px; }
        input, button { padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
        input { flex: 1; min-width: 150px; }
        button { background-color: #28a745; color: white; cursor: pointer; border: none; font-weight: bold; min-width: 120px; }
        button:hover { background-color: #218838; transform: translateY(-1px); }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; overflow: hidden; border-radius: 8px; }
        th, td { border-bottom: 1px solid #eee; padding: 15px; text-align: left; }
        th { background-color: #1a73e8; color: white; font-weight: 500; }
        tr:hover { background-color: #fcfcfc; }
        .status-tag { padding: 5px 10px; border-radius: 20px; font-size: 12px; background: #e8f0fe; color: #1a73e8; font-weight: bold; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">
    <h2>🚗 ระบบจัดการตารางเช่ารถ</h2>
    
    <div class="form-group">
        <input type="text" id="carModel" placeholder="รุ่นรถ (เช่น Honda Civic)">
        <input type="text" id="renterName" placeholder="ชื่อผู้เช่า">
        <input type="date" id="rentalDate">
        <button id="btnSubmit">บันทึกการจอง</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>รุ่นรถ</th>
                <th>ชื่อผู้เช่า</th>
                <th>วันที่เช่า</th>
                <th>สถานะ</th>
            </tr>
        </thead>
        <tbody id="rentalTableBody">
            <tr><td colspan="4" style="text-align:center;">กำลังโหลดข้อมูล...</td></tr>
        </tbody>
    </table>
</div>

<script>
    // --- ตั้งค่า SUPABASE ---
    const SUPABASE_URL = 'https://jgwcyesxajinnpwbtkep.supabase.co'; 
    const SUPABASE_KEY = 'sb_publishable_SQrXsMRE5mXvcWOFhTZzMw_uTQjMish';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // --- ฟังก์ชันดึงข้อมูล ---
    async function fetchRentals() {
        const { data, error } = await supabaseClient
            .from('car_rentals')
            .select('*')
            .order('rental_date', { ascending: true });

        if (error) {
            console.error('Error:', error);
            return;
        }

        const tableBody = document.getElementById('rentalTableBody');
        tableBody.innerHTML = ''; 

        if (data.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="4" style="text-align:center;">ไม่พบข้อมูลการจอง</td></tr>';
            return;
        }

        data.forEach(item => {
            const row = `
                <tr>
                    <td><strong>${item.car_model}</strong></td>
                    <td>${item.renter_name}</td>
                    <td>${new Date(item.rental_date).toLocaleDateString('th-TH')}</td>
                    <td><span class="status-tag">${item.status || 'รอดำเนินการ'}</span></td>
                </tr>
            `;
            tableBody.innerHTML += row;
        });
    }

    // --- ฟังก์ชันเพิ่มข้อมูล ---
    async function addRental() {
        const carModel = document.getElementById('carModel').value;
        const renterName = document.getElementById('renterName').value;
        const rentalDate = document.getElementById('rentalDate').value;

        if (!carModel || !renterName || !rentalDate) {
            alert('กรุณากรอกข้อมูลให้ครบทุกช่องครับ');
            return;
        }

        const { error } = await supabaseClient
            .from('car_rentals')
            .insert([{ 
                car_model: carModel, 
                renter_name: renterName, 
                rental_date: rentalDate,
                status: 'ยืนยันแล้ว'
            }]);

        if (error) {
            alert('บันทึกไม่สำเร็จ: ' + error.message);
        } else {
            // ล้างค่าในฟอร์ม
            document.getElementById('carModel').value = '';
            document.getElementById('renterName').value = '';
            document.getElementById('rentalDate').value = '';
            fetchRentals(); // อัปเดตตาราง
        }
    }

    // --- ตรวจสอบว่าโหลดหน้าเว็บเสร็จแล้วค่อยทำงาน ---
    document.addEventListener('DOMContentLoaded', () => {
        // ผูกฟังก์ชันกับปุ่มกด (ป้องกัน Error: addRental is not defined)
        document.getElementById('btnSubmit').addEventListener('click', addRental);
        
        // ดึงข้อมูลครั้งแรก
        fetchRentals();
    });
</script>

</body>
</html>
